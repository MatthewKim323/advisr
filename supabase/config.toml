# Supabase project config.
# Generate a fresh one with `supabase init` if starting from scratch;
# this is a minimal version checked in so CI + local dev agree.

project_id = "nami"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
shadow_port = 54320
major_version = 15

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:2847"
additional_redirect_urls = ["http://localhost:2847/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false
