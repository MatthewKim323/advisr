<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="#080E1A"/>
  <!-- emerald rule (nami's signal color) -->
  <rect x="3" y="25" width="26" height="1" fill="#10B981"/>
  <!-- pixel "n" glyph, 3 strokes -->
  <g fill="#FFFFFF">
    <!-- left stem -->
    <rect x="8"  y="10" width="3" height="14"/>
    <!-- top bar -->
    <rect x="11" y="10" width="10" height="3"/>
    <!-- right stem -->
    <rect x="21" y="10" width="3" height="14"/>
  </g>
  <!-- tiny signal dot over the right stem -->
  <rect x="22" y="6" width="2" height="2" fill="#10B981"/>
</svg>
